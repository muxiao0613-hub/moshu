[package]
name = "moshub"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "moshub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "moshub"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:rfd", "dep:opener"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["macos-private-api"], optional = true }
tauri-plugin-single-instance = { version = "=2.5.3", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
tokio = { version = "=1.53.2", features = ["sync", "rt", "macros", "time", "net"] }
fs2 = "=0.4.3"
sha2 = "=0.11.0"
base64 = "=0.22.1"
url = "=2.5.8"
tempfile = "=3.27.0"
rfd = { version = "=0.17.2", optional = true }
opener = { version = "=0.9.0", optional = true }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
quick-xml = "=0.41.0"
calamine = { version = "=0.36.1", features = ["chrono"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
csv = "=1.4.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "=3.27.0"
